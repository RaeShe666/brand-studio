name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish installer assets to (for release recovery)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: brand-studio-windows-installer
          path: release/**/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.exe
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
